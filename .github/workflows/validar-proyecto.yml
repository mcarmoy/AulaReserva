name: Validar proyecto AulaReserva

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Comprobar archivos frontend
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            frontend/index.html
            frontend/app.js
            frontend/reserva.js

      - name: Comprobar sintaxis JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/reserva.js

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Comprobar archivos backend
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            backend/public/index.php
            backend/public/reservas.php

      - name: Comprobar sintaxis PHP
        run: |
          php -l backend/public/index.php
          php -l backend/public/reservas.php

  resultado:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar resultado
        run: echo "Frontend y backend correctos"