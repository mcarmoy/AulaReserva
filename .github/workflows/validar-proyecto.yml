name: Validar proyecto AulaReserva

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar evento
        env:
          EVENTO: ${{ github.event_name }}
          REFERENCIA: ${{ github.ref }}
          RAMA_ORIGEN: ${{ github.head_ref }}
          RAMA_DESTINO: ${{ github.base_ref }}
        run: |
          echo "Evento: $EVENTO"
          echo "Referencia: $REFERENCIA"
          echo "Rama origen (solo en PR): $RAMA_ORIGEN"
          echo "Rama destino (solo en PR): $RAMA_DESTINO"

      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Validar estructura del proyecto
        id: validacion
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            README.md
            frontend/index.html
            frontend/app.js
            frontend/reserva.js
            backend/public/index.php
            .github/actions/validar-aulareserva/action.yml

      - name: Mostrar resultado
        run: |
          echo "Rutas verificadas por la Action: ${{ steps.validacion.outputs.total }}"