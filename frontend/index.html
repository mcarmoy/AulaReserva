<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AulaReserva</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f4f6f8;
    }

    #lista-aulas {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .tarjeta {
      background: white;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      min-width: 200px;
    }

    .tarjeta h3 {
      margin: 0 0 0.5rem;
      color: #1d3557;
    }

    #form-reserva {
      display: grid;
      gap: 0.5rem;
      max-width: 400px;
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    #form-reserva input,
    #form-reserva select {
      padding: 0.4rem;
    }

    #form-reserva button {
      margin-top: 0.5rem;
      padding: 0.6rem;
      background: #1d3557;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .error {
      color: #b00020;
    }

    .ok {
      color: #1b7f3b;
    }

    #lista-reservas button {
      margin-left: 0.5rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>AulaReserva</h1>

  <section>
    <h2>Aulas disponibles</h2>
    <div id="lista-aulas">Cargando aulas...</div>
  </section>

  <section>
    <h2>Solicitar reserva</h2>
    <form id="form-reserva">
      <label for="aula">Aula</label>
      <select id="aula" name="aula">
        <option value="">-- Selecciona un aula --</option>
      </select>

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" name="fecha">

      <label for="hora">Hora</label>
      <input type="time" id="hora" name="hora">

      <label for="responsable">Responsable</label>
      <input type="text" id="responsable" name="responsable" placeholder="Nombre y apellidos">

      <button type="submit">Solicitar reserva</button>
    </form>
    <div id="mensaje-reserva"></div>
  </section>


  <section>
    <h2>Reservas guardadas</h2>
    <ul id="lista-reservas">Cargando reservas...</ul>
  </section>

  <script src="app.js" defer></script>
  <script src="reserva.js" defer></script>
</body>

</html>
